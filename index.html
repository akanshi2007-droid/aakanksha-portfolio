<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aakanksha Singh · Frontend Developer Portfolio</title>
  <meta name="description" content="Portfolio of Aakanksha Singh, a Computer Science (Data Science) undergraduate and frontend developer building responsive React interfaces." />
  <meta name="theme-color" content="#ff7eb6" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <!-- Everything inside #app is rendered by src/main.js from src/components + src/data -->
  <div id="app"></div>

  <noscript>
    <p style="padding:40px;font:20px monospace">Please enable JavaScript to view this portfolio.</p>
  </noscript>

  <!-- Helpful message if the file is double-clicked (ES modules need a web server) -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div style="max-width:560px;margin:80px auto;padding:24px;background:#fffaf5;border:4px solid #3b2352;border-radius:16px;font:20px/1.4 monospace;color:#3b2352">' +
        '<b>Almost there ♡</b><br><br>This project uses JavaScript modules, so it must be opened through a local server, not by double-clicking the file.<br><br>' +
        'Run <code>npx serve .</code> in this folder (or use the VS Code "Live Server" extension), then open the link it prints.</div>';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
